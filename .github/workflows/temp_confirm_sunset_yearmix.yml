name: Temporary confirm Sunset candidate from 2012 archive

"on":
  push:
    branches:
      - temp-confirm-sunset-yearmix-20260904

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download separated montage
        uses: actions/download-artifact@v4
        with:
          name: bad-friends-demucs-identification
          path: montage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: marcboyertime/OptionsScout
          run-id: 33841219671

      - name: Install tools and download 2012 yearmix
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq
          python -m pip install --upgrade shazamio==0.8.1 numpy scipy librosa soundfile
          mkdir -p work/scans results
          ARCHIVE='https://archive.org/download/I.m.RedTranceDigitalRadioWorldwide-VSessionsWordwide140yearmix2012/I.m.RedTranceDigitalRadioWorldwide-VSessionsWordwide140yearmix2012.mp3'
          curl -L --fail --retry 8 --retry-all-errors --connect-timeout 30 --max-time 900 \
            "$ARCHIVE" -o work/yearmix.mp3
          test -s work/yearmix.mp3
          ffprobe -v error -show_entries format=duration,size -of json work/yearmix.mp3 \
            | tee results/yearmix_probe.json

      - name: Scan likely track-40 region with Shazam
        shell: bash
        run: |
          set -euxo pipefail
          cat > scan_yearmix.py <<'PY'
          import asyncio, json, math, pathlib, subprocess
          from shazamio import Shazam

          probe=json.loads(pathlib.Path('results/yearmix_probe.json').read_text())
          duration=float(probe['format']['duration'])
          # Track 40 of 64 should lie in this broad interval even with variable track lengths.
          starts=[]
          s=duration*0.44
          while s < duration*0.78:
              starts.append(round(s,1)); s+=45.0

          scan_dir=pathlib.Path('work/scans'); scan_dir.mkdir(exist_ok=True)
          for i,start in enumerate(starts):
              out=scan_dir/f'scan_{i:03d}_{start:.1f}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i','work/yearmix.mp3','-t','18','-ac','1','-ar','44100','-c:a','pcm_s16le',str(out)],check=True)

          sem=asyncio.Semaphore(5)
          async def identify(i,start,path):
              async with sem:
                  try:
                      data=await Shazam().recognize(str(path))
                      t=data.get('track') or {}
                      return {'i':i,'yearmix_start_s':start,'file':str(path),'title':t.get('title'),'artist':t.get('subtitle'),'key':t.get('key'),'isrc':t.get('isrc'),'matches':data.get('matches') or []}
                  except Exception as e:
                      return {'i':i,'yearmix_start_s':start,'file':str(path),'error':repr(e)}

          async def main():
              rows=await asyncio.gather(*(identify(i,starts[i],p) for i,p in enumerate(sorted(scan_dir.glob('scan_*.wav')))))
              pathlib.Path('results/yearmix_scan.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              for r in rows:
                  if r.get('title'):
                      print(f"{r['yearmix_start_s']:9.1f}  {r.get('title')} — {r.get('artist')} key={r.get('key')} matches={r.get('matches')}")
              target=[r for r in rows if str(r.get('key'))=='70475344' or (r.get('title') or '').lower().startswith('sunset (k-narf')]
              pathlib.Path('results/target_hits.json').write_text(json.dumps(target,indent=2,ensure_ascii=False))
              print('TARGET_HITS',json.dumps(target,indent=2,ensure_ascii=False))
          asyncio.run(main())
          PY
          python scan_yearmix.py | tee results/yearmix_scan_console.txt

      - name: Extract target passage and acoustically compare with montage
        shell: bash
        run: |
          set -euxo pipefail
          cat > compare_target.py <<'PY'
          import json, pathlib, subprocess
          import numpy as np
          import librosa
          from scipy.signal import correlate

          hits=json.loads(pathlib.Path('results/target_hits.json').read_text())
          if not hits:
              pathlib.Path('results/comparison.json').write_text(json.dumps({'target_hit':False},indent=2))
              print('No target Shazam hit in broad scan')
              raise SystemExit(0)

          hit=hits[0]
          center=float(hit['yearmix_start_s'])+9
          region_start=max(0,center-90)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(region_start),'-i','work/yearmix.mp3','-t','180','-ac','1','-ar','22050','-c:a','pcm_s16le','work/yearmix_target_region.wav'],check=True)
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i','work/yearmix_target_region.wav','-c:a','libmp3lame','-b:a','256k','results/yearmix_target_region.mp3'],check=True)

          montage_file=next(pathlib.Path('montage').rglob('montage_no_dialogue.mp3'))
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(montage_file),'-ac','1','-ar','22050','-c:a','pcm_s16le','work/montage.wav'],check=True)
          ym,sr=librosa.load('work/montage.wav',sr=22050,mono=True)
          yr,_=librosa.load('work/yearmix_target_region.wav',sr=22050,mono=True)

          def norm_valid(q,t):
              q=np.asarray(q,dtype=np.float64); t=np.asarray(t,dtype=np.float64)
              q=q-q.mean(); q=q/(q.std()+1e-12)
              t=t-t.mean(); t=t/(t.std()+1e-12)
              raw=correlate(t,q,mode='valid',method='fft')
              n=len(q)
              cs=np.r_[0,np.cumsum(t)]; cs2=np.r_[0,np.cumsum(t*t)]
              sm=cs[n:]-cs[:-n]; sm2=cs2[n:]-cs2[:-n]
              den=np.sqrt(np.maximum(sm2-sm*sm/n,1e-9)*np.sum(q*q))
              c=raw/den
              i=int(np.argmax(np.abs(c)))
              return float(abs(c[i])),float(c[i]),float(i/sr)

          matches=[]
          # Shazam's montage recognition came from approximately seconds 32-46.
          for mstart in [20,24,28,30,32,34,36,38,40,44]:
              q=ym[int(mstart*sr):int((mstart+14)*sr)]
              for rate in [0.94,0.96,0.965,0.97,0.98,0.99,1.0,1.01,1.02,1.03,1.04,1.06]:
                  qr=librosa.effects.time_stretch(q,rate=rate) if rate!=1 else q
                  score,signed,offset=norm_valid(qr,yr)
                  matches.append({'score':score,'signed':signed,'montage_start_s':mstart,'rate':rate,'region_offset_s':offset,'yearmix_absolute_s':region_start+offset})
          matches.sort(key=lambda x:x['score'],reverse=True)
          out={'target_hit':True,'hit':hit,'region_start_s':region_start,'best_waveform_matches':matches[:30]}
          pathlib.Path('results/comparison.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          python compare_target.py | tee results/comparison_console.txt

      - name: Upload confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sunset-yearmix-confirmation
          path: results/
          if-no-files-found: error
          retention-days: 1
