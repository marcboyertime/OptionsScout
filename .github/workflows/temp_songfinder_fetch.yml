name: Temporary direct-fetch SongFinder recognition

"on":
  push:
    branches:
      - temp-songfinder-fetch-20260904

permissions:
  actions: read
  contents: read

jobs:
  recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download music stem
        uses: actions/download-artifact@v4
        with:
          name: bad-friends-demucs-identification
          path: input
          github-token: ${{ github.token }}
          repository: marcboyertime/OptionsScout
          run-id: 33841219671
      - name: Install and prepare
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium
          mkdir -p clips results
          src="$(find input -type f -name montage_no_dialogue.mp3 | head -n1)"
          ffmpeg -hide_banner -loglevel error -y -ss 20 -t 24 -i "$src" -af loudnorm=I=-14:TP=-1.5:LRA=8 -b:a 192k clips/middle.mp3
      - name: Generate verification token and POST directly
        shell: bash
        run: |
          set -u
          cat > run.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  ctx=await browser.new_context()
                  page=await ctx.new_page()
                  calls=[]
                  async def response(resp):
                      if '/api/recognize/' in resp.url:
                          try: body=await resp.text()
                          except Exception as e: body=repr(e)
                          calls.append({'url':resp.url,'status':resp.status,'headers':await resp.all_headers(),'body':body})
                  page.on('response',response)
                  await page.goto('https://songfinder.gg/',wait_until='networkidle',timeout=120000)
                  await page.wait_for_function('window.recaptchaUtil && typeof window.recaptchaUtil.getRecaptchaToken === "function"',timeout=120000)
                  inp=page.locator('input[type=file]').first
                  await inp.set_input_files(str(Path('clips/middle.mp3').resolve()))
                  out=await page.evaluate('''async () => {
                    const f=document.querySelector('input[type=file]').files[0];
                    const token=await window.recaptchaUtil.getRecaptchaToken('fileupload');
                    const fd=new FormData(); fd.append('file',f,f.name); fd.append('startTime','0'); fd.append('recaptchaToken',token);
                    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),180000);
                    try {
                      const r=await fetch('/api/recognize/file',{method:'POST',body:fd,signal:controller.signal});
                      const text=await r.text();
                      return {status:r.status,headers:Object.fromEntries(r.headers.entries()),text,tokenLength:token.length};
                    } catch(e) { return {error:String(e),tokenLength:token.length}; }
                    finally { clearTimeout(timer); }
                  }''')
                  result={'evaluate':out,'network':calls,'body':(await page.locator('body').inner_text())[:40000]}
                  Path('results/result.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
                  print(json.dumps(result,indent=2,ensure_ascii=False))
                  await page.screenshot(path='results/page.png',full_page=True)
                  await browser.close()
          asyncio.run(main())
          PY
          python run.py | tee results/console.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: direct-fetch-songfinder-result
          path: results/
          retention-days: 1
