name: Temporary Shazam persistence test

"on":
  push:
    branches:
      - temp-shazam-persistence-20260904

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download separated montage
        uses: actions/download-artifact@v4
        with:
          name: bad-friends-demucs-identification
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: marcboyertime/OptionsScout
          run-id: 33841219671

      - name: Prepare dense overlapping windows
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade shazamio==0.8.1
          mkdir -p windows results
          source_file="$(find input -type f -name montage_no_dialogue.mp3 | head -n 1)"
          test -n "$source_file"
          # Dense grid around the only region that previously produced the candidate.
          for start in $(seq 20 1 45); do
            for dur in 8 10 12 14 16 18 20; do
              ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$source_file" -t "$dur" \
                -ac 1 -ar 44100 -c:a pcm_s16le "windows/s${start}_d${dur}.wav"
            done
          done
          # Add modest tempo corrections suggested by the returned Shazam skew.
          for rate in 0.965 0.98 1.02 1.036; do
            label="$(echo "$rate" | tr '.' '_')"
            ffmpeg -hide_banner -loglevel error -y -i "$source_file" \
              -filter:a "atempo=${rate}" -ac 1 -ar 44100 -c:a pcm_s16le "windows/full_rate_${label}.wav"
          done

      - name: Recognize all windows concurrently
        shell: bash
        run: |
          set -euxo pipefail
          cat > persistence.py <<'PY'
          import asyncio, json, pathlib, re
          from collections import Counter, defaultdict
          from shazamio import Shazam

          files=sorted(pathlib.Path('windows').glob('*.wav'))
          sem=asyncio.Semaphore(10)
          async def one(path):
              async with sem:
                  try:
                      out=await Shazam().recognize(str(path))
                      t=out.get('track') or {}
                      m=out.get('matches') or []
                      return {'file':path.name,'title':t.get('title'),'artist':t.get('subtitle'),'key':t.get('key'),'isrc':t.get('isrc'),'matches':m}
                  except Exception as e:
                      return {'file':path.name,'error':repr(e)}
          async def main():
              rows=await asyncio.gather(*(one(p) for p in files))
              pathlib.Path('results/all.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              counts=Counter((r.get('key'),r.get('title'),r.get('artist')) for r in rows if r.get('title'))
              target=[r for r in rows if str(r.get('key'))=='70475344']
              starts=defaultdict(int)
              for r in target:
                  m=re.match(r's(\d+)_d(\d+)',r['file'])
                  if m: starts[int(m.group(1))]+=1
              summary={
                'total_windows':len(rows),
                'recognized_windows':sum(1 for r in rows if r.get('title')),
                'top_titles':[{'key':k[0],'title':k[1],'artist':k[2],'count':v} for k,v in counts.most_common(20)],
                'target_count':len(target),
                'target_distinct_starts':sorted(starts),
                'target_per_start':dict(sorted(starts.items())),
                'target_rows':target,
              }
              pathlib.Path('results/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
              print(json.dumps(summary,indent=2,ensure_ascii=False))
          asyncio.run(main())
          PY
          python persistence.py | tee results/console.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: shazam-persistence-results
          path: results/
          if-no-files-found: error
          retention-days: 1
